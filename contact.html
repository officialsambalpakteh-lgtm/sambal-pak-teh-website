<section class="contact-section">

    <div class="contact-container">

        <h2>Hubungi Sambal Petai Pak Teh</h2>

        <p>
            Sebarang pertanyaan mengenai produk, stok atau pembelian,
            sila isi borang di bawah.
        </p>


        <form onsubmit="sendWhatsApp(); return false;" class="contact-form">


            <label>Nama Anda</label>
            <input 
            type="text" 
            id="nama" 
            placeholder="Masukkan nama anda"
            required>


            <label>No WhatsApp Anda</label>
            <input 
            type="tel" 
            id="telefon" 
            placeholder="Contoh: 0123456789"
            required>


            <label>Pertanyaan</label>
            <textarea 
            id="pertanyaan"
            rows="5"
            placeholder="Tulis pertanyaan anda di sini..."
            required></textarea>


            <button type="submit" class="btn primary-btn">
                Hantar Pertanyaan WhatsApp
            </button>


        </form>


    </div>

</section>



<script>

function sendWhatsApp(){

    let nama = document.getElementById("nama").value;
    let telefon = document.getElementById("telefon").value;
    let pertanyaan = document.getElementById("pertanyaan").value;


    let nombor = "60137569845";


    let mesej = 
    "Assalamualaikum Sambal Petai Pak Teh,%0A%0A" +
    "Saya ingin bertanya mengenai produk.%0A%0A" +
    "Nama: " + nama + "%0A" +
    "No WhatsApp: " + telefon + "%0A" +
    "Pertanyaan: " + pertanyaan;


    let url = 
    "https://wa.me/" + nombor + "?text=" + mesej;


    window.open(url, "_blank");

}

</script>
